<html lang="ja"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>撮影準備シート｜おひとり様キッチン</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600;800&amp;family=Noto+Sans+JP:wght@300;400;500;700&amp;display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:    #FFFFFF;
      --off:   #F7F5F2;
      --div:   #E4E0DA;
      --text:  #1A1714;
      --text2: #706860;
      --text3: #A89E95;
      --ink:   #0E0D0A;
      --tc:    #7A3A14;
      --tc-bg: #F5EDE5;
      --ai-bg: #F0EDE8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: 'Noto Sans JP', -apple-system, 'Hiragino Sans', sans-serif;
      background: var(--bg); color: var(--text);
      min-height: 100vh; font-weight: 300;
      -webkit-font-smoothing: antialiased;
    }
    #app { max-width: 620px; margin: 0 auto; min-height: 100vh; }

    /* ─── HEADER ─── */
    .header {
      background: #fff; border-bottom: 1px solid var(--div);
      padding: 0 20px; height: 48px;
      position: sticky; top: 0; z-index: 100;
      display: flex; align-items: center;
    }
    .header-inner { display: flex; align-items: center; justify-content: space-between; width: 100%; }
    .logo-title {
      font-family: 'Shippori Mincho', serif;
      font-size: 13px; font-weight: 800; letter-spacing: .1em; color: var(--text);
    }
    .logo-sub { font-size: 8px; color: var(--text3); letter-spacing: .16em; margin-top: 1px; }
    .back-btn {
      display: flex; align-items: center; gap: 5px;
      font-size: 12px; color: var(--text2); cursor: pointer; font-weight: 300;
    }
    .back-btn svg { width: 15px; height: 15px; }

    /* ═══════════ LIST VIEW ═══════════ */
    .list-top { padding: 32px 20px 20px; border-bottom: 1px solid var(--div); }
    .list-top-label { font-size: 9px; letter-spacing: .2em; color: var(--text3); margin-bottom: 8px; }
    .list-top h2 {
      font-family: 'Shippori Mincho', serif;
      font-size: 26px; font-weight: 800; color: var(--text);
    }
    .list-top p { font-size: 12px; color: var(--text3); margin-top: 5px; }

    /* ─── TABS ─── */
    .tab-bar {
      display: flex; border-bottom: 1px solid var(--div);
      background: #fff; position: sticky; top: 48px; z-index: 90;
    }
    .tab-btn {
      flex: 1; padding: 12px 0; font-size: 11px; font-weight: 400;
      color: var(--text3); background: none; border: none;
      cursor: pointer; letter-spacing: .06em;
      font-family: 'Noto Sans JP', sans-serif;
      border-bottom: 2px solid transparent; margin-bottom: -1px;
      transition: color .15s, border-color .15s;
    }
    .tab-btn.active { color: var(--text); border-bottom-color: var(--ink); font-weight: 500; }

    .recipe-list { display: flex; flex-direction: column; }

    .recipe-card {
      cursor: pointer; border-bottom: 1px solid var(--div);
      background: #fff; display: flex; flex-direction: column;
    }
    .recipe-card:active { background: var(--off); }

    .card-img-area {
      aspect-ratio: 3/2; background: var(--off);
      overflow: hidden; position: relative;
      display: flex; align-items: center; justify-content: center;
    }
    .card-img-area img { width: 100%; height: 100%; object-fit: cover; }
    .card-img-emoji { font-size: 72px; opacity: .35; }
    .card-num {
      position: absolute; left: 16px; bottom: 12px;
      font-family: 'Shippori Mincho', serif;
      font-size: 48px; font-weight: 800; color: #fff;
      line-height: 1; text-shadow: 0 1px 8px rgba(0,0,0,.35);
    }

    .card-info { padding: 18px 20px 22px; }
    .card-recipe-name {
      font-family: 'Shippori Mincho', serif;
      font-size: 20px; font-weight: 700; line-height: 1.35; color: var(--text);
    }
    .card-recipe-sub { font-size: 12px; color: var(--text2); margin-top: 5px; font-weight: 300; }
    .card-meta { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
    .card-recipe-by { font-size: 10px; color: var(--text3); }
    .card-tc-tags { display: flex; flex-wrap: wrap; gap: 5px; }
    .card-tc-tag {
      font-size: 9px; color: var(--tc);
      border: 1px solid var(--tc); padding: 1px 7px;
    }

    /* ═══════════ DETAIL VIEW ═══════════ */
    .detail-hero-img {
      width: 100%; aspect-ratio: 4/3;
      background: var(--off);
      overflow: hidden; position: relative;
      display: flex; align-items: center; justify-content: center;
    }
    .detail-hero-img img { width: 100%; height: 100%; object-fit: cover; }
    .detail-hero-emoji { font-size: 110px; opacity: .1; }
    .detail-hero-num {
      position: absolute; left: 18px; bottom: 14px;
      font-family: 'Shippori Mincho', serif;
      font-size: 72px; font-weight: 800; color: #fff;
      line-height: 1; text-shadow: 0 2px 12px rgba(0,0,0,.4);
    }
    .detail-hero-placeholder {
      position: absolute; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
    }
    .detail-hero-placeholder-label { font-size: 9px; color: var(--text3); letter-spacing: .14em; }
    .img-loading {
      position: absolute; inset: 0;
      background: rgba(255,255,255,.88);
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    }
    .spinner {
      width: 28px; height: 28px;
      border: 2px solid var(--div); border-top-color: var(--ink);
      border-radius: 50%; animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .img-loading-text { font-size: 10px; color: var(--text2); letter-spacing: .1em; }
    .img-loading-roles { display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .img-loading-roles span { font-size: 10px; color: var(--text3); animation: fadeIn 0.4s ease both; }
    .img-loading-roles span:nth-child(1) { animation-delay: 0s; }
    .img-loading-roles span:nth-child(2) { animation-delay: 0.35s; }
    .img-loading-roles span:nth-child(3) { animation-delay: 0.7s; }
    .img-loading-roles span:nth-child(4) { animation-delay: 1.05s; }
    .img-loading-roles span:nth-child(5) { animation-delay: 1.4s; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
    .img-error {
      position: absolute; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
    }
    .img-error-text { font-size: 11px; color: var(--text2); text-align: center; line-height: 1.8; }

    /* image actions bar */
    .img-action-bar {
      padding: 12px 20px; display: flex; gap: 7px;
      border-bottom: 1px solid var(--div);
    }
    .btn-gen {
      flex: 1; padding: 10px 0;
      background: var(--ink); color: #fff; border: none;
      font-family: 'Noto Sans JP', sans-serif;
      font-size: 11px; font-weight: 700; cursor: pointer; letter-spacing: .08em;
    }
    .btn-gen:disabled { opacity: .4; }
    .btn-upload {
      padding: 10px 13px; background: #fff; color: var(--text);
      border: 1px solid var(--div); font-family: 'Noto Sans JP', sans-serif;
      font-size: 11px; font-weight: 300; cursor: pointer; white-space: nowrap;
    }
    .btn-copy-p {
      padding: 10px 12px; background: #fff; color: var(--text2);
      border: 1px solid var(--div); font-family: 'Noto Sans JP', sans-serif;
      font-size: 11px; cursor: pointer;
    }
    .btn-export {
      font-size: 10px; color: var(--text2); background: none;
      border: 1px solid var(--div); padding: 5px 10px;
      cursor: pointer; font-family: 'Noto Sans JP', sans-serif;
      white-space: nowrap; letter-spacing: .04em;
    }
    .btn-export:disabled { opacity: .45; }
    .prompt-area { padding: 9px 20px; border-bottom: 1px solid var(--div); }
    .prompt-toggle {
      font-size: 9px; color: var(--text3); background: none; border: none;
      cursor: pointer; letter-spacing: .1em; text-decoration: underline;
      font-family: 'Noto Sans JP', sans-serif;
    }
    .prompt-text { font-size: 9.5px; color: var(--text3); line-height: 1.9; margin-top: 7px; display: none; }
    .nano-link {
      display: block; padding: 9px 20px;
      font-size: 9px; color: var(--text3); text-decoration: none;
      letter-spacing: .1em; border-bottom: 1px solid var(--div);
    }

    /* ── Detail title block ── */
    .detail-title-block {
      padding: 26px 20px 22px; text-align: center;
      border-bottom: 1px solid var(--div);
    }
    .detail-row-label { font-size: 9px; letter-spacing: .2em; color: var(--text3); margin-bottom: 12px; }
    .detail-name {
      font-family: 'Shippori Mincho', serif;
      font-size: 26px; font-weight: 800; line-height: 1.3; color: var(--text);
    }
    .detail-sub { font-size: 12.5px; color: var(--text2); margin-top: 8px; font-weight: 300; }
    .detail-by { font-size: 10px; color: var(--text3); margin-top: 12px; letter-spacing: .08em; }

    /* ── Recipe two-column layout (材料 | 作り方) ── */
    .recipe-layout {
      display: grid; grid-template-columns: 2fr 3fr;
      border-bottom: 1px solid var(--div);
    }
    .recipe-col { padding: 20px 16px 24px; }
    .recipe-col + .recipe-col { border-left: 1px solid var(--div); }
    .recipe-col-head {
      font-size: 9.5px; letter-spacing: .16em; color: var(--text2);
      border-bottom: 1px solid var(--div); padding-bottom: 8px; margin-bottom: 12px;
    }
    .recipe-col-head span { font-size: 8.5px; color: var(--text3); font-weight: 300; letter-spacing: .04em; }

    /* Ingredient list with dot leader */
    .ing-list { list-style: none; }
    .ing-item { display: flex; align-items: baseline; padding: 4px 0; gap: 0; }
    .ing-badge { font-size: 8px; font-weight: 700; padding: 1px 5px; white-space: nowrap; flex-shrink: 0; margin-right: 4px; letter-spacing: .04em; }
    .b-tc { background: var(--tc-bg); color: var(--tc); }
    .b-ai { background: var(--ai-bg); color: var(--text2); }
    .ing-name { font-size: 11.5px; white-space: nowrap; overflow: hidden; flex-shrink: 0; max-width: 55%; }
    .ing-dots { flex: 1; border-bottom: 1px dotted var(--text3); position: relative; bottom: 2px; min-width: 4px; margin: 0 3px; }
    .ing-qty { font-size: 10.5px; color: var(--text2); white-space: nowrap; flex-shrink: 0; }

    /* Steps (作り方) */
    .step { display: flex; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--div); }
    .step:last-child { border-bottom: none; }
    .step-n {
      flex-shrink: 0; width: 20px; height: 20px;
      border: 1px solid var(--ink); color: var(--ink);
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      font-size: 9.5px; font-weight: 700; margin-top: 1px;
    }
    .step-t { font-size: 12px; line-height: 1.75; font-weight: 300; }

    /* ── Role Banner ── */
    .role-banner {
      display: flex; overflow-x: auto; gap: 1px; background: var(--div);
      border-top: 1px solid var(--div); border-bottom: 1px solid var(--div);
      -webkit-overflow-scrolling: touch; scrollbar-width: none;
    }
    .role-banner::-webkit-scrollbar { display: none; }
    .role-banner-card {
      flex-shrink: 0; background: #fff;
      padding: 13px 11px 11px;
      display: flex; flex-direction: column; align-items: center; gap: 5px;
      cursor: pointer; transition: background .12s; min-width: 76px;
    }
    .role-banner-card.active { background: var(--tc-bg); }
    .role-banner-card.active .role-banner-name { color: var(--tc); }
    .role-banner-icon { font-size: 20px; line-height: 1; }
    .role-banner-name { font-size: 8.5px; font-weight: 700; color: var(--text); text-align: center; line-height: 1.35; letter-spacing: .04em; transition: color .12s; }
    .role-banner-desc { font-size: 7px; color: var(--text3); text-align: center; line-height: 1.5; }

    /* ── Role Comment Box ── */
    .role-comment { display: none; border-bottom: 1px solid var(--div); animation: slideDown .16s ease; }
    .role-comment.open { display: block; }
    @keyframes slideDown { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
    .role-comment-head {
      padding: 11px 20px 10px; border-bottom: 1px solid var(--div);
      display: flex; align-items: center; gap: 9px; background: var(--tc-bg);
    }
    .role-comment-icon { font-size: 17px; flex-shrink: 0; }
    .role-comment-name {
      font-family: 'Shippori Mincho', serif;
      font-size: 12px; font-weight: 600; color: var(--tc); letter-spacing: .02em;
    }
    .role-comment-body { padding: 14px 20px; font-size: 13px; line-height: 1.85; color: var(--text); font-weight: 300; }

    /* ── detail-body 以下のセクション ── */
    .detail-body { display: flex; flex-direction: column; padding-bottom: 60px; }
    .sec { border-bottom: 1px solid var(--div); }
    .sec-head { padding: 15px 20px 13px; border-bottom: 1px solid var(--div); }
    .sec-label-text { font-size: 9.5px; letter-spacing: .16em; color: var(--text2); font-weight: 400; }
    .sec-body { padding: 16px 20px; }

    /* tips */
    .tip { padding: 10px 0; border-bottom: 1px solid var(--div); display: flex; gap: 12px; }
    .tip:last-child { border-bottom: none; }
    .tip i { font-size: 14px; flex-shrink: 0; line-height: 1.7; font-style: normal; }
    .tip span { font-size: 13px; line-height: 1.72; font-weight: 300; }

    /* notes 2-col */
    .note-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--div); }
    .note-card { background: #fff; padding: 14px; }
    .note-card h4 {
      font-size: 9px; letter-spacing: .12em; color: var(--text2);
      margin-bottom: 6px; font-weight: 400; font-family: 'Noto Sans JP', sans-serif;
    }
    .note-card p { font-size: 11.5px; line-height: 1.7; font-weight: 300; }

    /* SNS titles */
    .title-item {
      padding: 13px 0; border-bottom: 1px solid var(--div);
      display: flex; justify-content: space-between; align-items: center; gap: 12px;
    }
    .title-item:last-child { border-bottom: none; }
    .title-t { font-size: 13px; font-weight: 300; line-height: 1.55; flex: 1; }
    .cp-btn {
      background: none; border: 1px solid var(--div); padding: 5px 11px;
      font-size: 10px; color: var(--text2); cursor: pointer; white-space: nowrap;
      font-family: 'Noto Sans JP', sans-serif;
    }

    /* videos */
    .vid-link {
      display: flex; align-items: center; gap: 14px;
      padding: 12px 0; border-bottom: 1px solid var(--div);
      text-decoration: none; color: var(--text);
    }
    .vid-link:last-child { border-bottom: none; }
    .vid-icon { font-size: 17px; flex-shrink: 0; }
    .vid-info { flex: 1; min-width: 0; }
    .vid-title { font-size: 12px; font-weight: 400; }
    .vid-sub { font-size: 10px; color: var(--text3); margin-top: 2px; }
    .vtag { font-size: 8.5px; font-weight: 700; padding: 2px 7px; white-space: nowrap; }
    .vt-m { background: var(--ai-bg); color: #2A5C3A; }
    .vt-a { background: var(--ai-bg); color: var(--text2); }

    @media (max-width: 380px) {
      .note-grid { grid-template-columns: 1fr; }
      .recipe-layout { grid-template-columns: 1fr; }
      .recipe-col + .recipe-col { border-left: none; border-top: 1px solid var(--div); }
    }
  </style>
</head>

<div id="app"></div>
<script>
/* Pollinations.ai — 無料・APIキー不要 */
const POLLINATIONS_BASE = 'https://image.pollinations.ai/prompt';

/* エクスポートHTML用: スタッフ共有時に画像を埋め込むための変数。
   通常版では空。exportHTML()で生成したファイルには実際の画像データが入る */
const EMBEDDED_IMAGES = {};

function saveImage(id, dataUrl) {
  try { localStorage.setItem(`ohisama_img_${id}`, dataUrl); } catch(e) {}
}
function getStoredImage(id) {
  return EMBEDDED_IMAGES[id] || localStorage.getItem(`ohisama_img_${id}`);
}

function applyImage(id, src) {
  const area = document.getElementById(`ia-${id}`);
  if (area) {
    area.innerHTML = `<img src="${src}" alt="盛り付けイメージ">`;
  }
  saveImage(id, src);
  const listImg = document.querySelector(`.recipe-card[data-id="${id}"] .card-img-area`);
  if (listImg) listImg.innerHTML = `<img src="${src}" alt="">`;
}

/* スマホ写真は数MBになることが多くlocalStorageの上限を超えるため
   アップロード時に最大1024x768・JPEG品質0.82にリサイズしてから保存する */
function resizeAndUpload(id, file) {
  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      const maxW = 1024, maxH = 768;
      let w = img.naturalWidth, h = img.naturalHeight;
      if (w > maxW || h > maxH) {
        const ratio = Math.min(maxW / w, maxH / h);
        w = Math.round(w * ratio);
        h = Math.round(h * ratio);
      }
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      applyImage(id, canvas.toDataURL('image/jpeg', 0.82));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function handleImageUpload(id, input) {
  const file = input.files[0];
  if (!file) return;
  resizeAndUpload(id, file);
}

/* ── 5 ROLES ── */

    ],
    imgPrompt: 'Hyperrealistic professional food photography. Sichuan-style stir-fry dish: plump baby clams, jet-black wood ear mushrooms (kikurage) with distinctive ruffled texture, diagonal-cut garlic scapes, and thin julienned carrots, all coated in a thick glossy dark-red spicy sauce with visible starch glaze and tiny chili flakes. Served generously in a matte dark charcoal-grey deep ceramic bowl with a rough stoneware texture. Bowl placed on a weathered dark walnut wooden table with subtle wood grain. Wooden chopsticks with dark tips resting diagonally across the bowl rim. A thin streak of chili oil drizzled across the top. Toasted sesame seeds and thinly sliced green onion rings scattered naturally. Faint steam wisps rising from the hot dish. Camera positioned at 52-degree overhead angle — optimal to simultaneously reveal the depth of the bowl, the layered ingredients, and the glossy sauce surface. Natural warm daylight entering from the upper-left, creating gentle side shadows that give volume to the mushrooms and clams. Slight shallow depth of field with background softly blurred. Japanese food magazine aesthetic. Cinematic warm amber color grading. Extremely sharp focus on food surface. No text. No watermark.',

/* ── 5プロによるマスタープロンプト構築 ── */
function buildMasterPrompt(r) {
  const mainIngs = [...r.tamachan, ...r.ingredients].slice(0, 6).join(', ');
  const writer = `Dish name: "${r.name}". ${r.sub}. Key ingredients: ${mainIngs}.`;
  const stylist = 'Matte grey speckled ceramic plate or dark cast iron. Dark walnut wooden table surface. Natural linen napkin accent. Minimal garnish, clean presentation.';
  const photographer = 'Camera angle 50 degrees overhead. Natural window light entering from upper-left, warm amber tone. Soft shadow for depth. Slight bokeh background. Sharp focus on food texture and surface detail.';
  const chef = 'Food looks perfectly cooked: vibrant natural colors, correct textures (glossy sauce, visible steam, proper doneness). Generous hearty portion. Appetizing, natural, not over-styled.';
  const sns = 'Composition optimized for Japanese short-form video thumbnail. Food fills 70% of frame. Mouth-watering, scroll-stopping. Warm, inviting, natural atmosphere. @for_thetable TikTok aesthetic.';

  return `Hyperrealistic professional food photography. Ultra-detailed, photographic quality.

[Recipe Writer] ${writer}
[Food Stylist] ${stylist}
[Food Photographer] ${photographer}
[Chef/Nutritionist] ${chef}
[SNS Marketer] ${sns}

Overall style: restaurant-quality home cooking on natural ceramic plates with dark wooden background. Warm tones. No text overlays. Real food only.`;
}

/* ── 画像生成用プロンプト：実際の材料を動的注入 ── */
function buildImagePrompt(r) {
  const clean = s => s.replace(/\s*[\d／〜]+.*$/, '').replace(/\s*(大さじ|小さじ|カップ|本|個|枚|缶|cc|g|ml).*$/, '').trim();
  const tcItems  = r.tamachan.map(clean).join(', ');
  const ingItems = r.ingredients.slice(0, 6).map(clean).join(', ');
  const ingLine  = `The dish must visibly contain ALL of these specific ingredients: ${tcItems}, ${ingItems}.`;
  return `${ingLine} ${r.imgPrompt}`;
}

function clearAndGenerate(id) {
  localStorage.removeItem(`ohisama_img_${id}`);
  generateImage(id);
}

/* ── POLLINATIONS IMAGE GENERATION（無料・APIキー不要・img src方式） ── */
function generateImage(id) {
  const r    = RECIPES.find(r => r.id === id);
  const area = document.getElementById(`ia-${id}`);
  const btn  = document.getElementById(`bg-${id}`);

  const num = RECIPES.findIndex(x => x.id === id) + 1;
  area.innerHTML = `
    <span class="detail-hero-emoji">${r.emoji}</span>
    <div class="detail-hero-num">${num}</div>
    <div class="img-loading">
      <div class="spinner"></div>
      <div class="img-loading-roles">
        <span>✍️ レシピ確認中</span>
        <span>🎨 スタイリング設計中</span>
        <span>📷 構図・光を設定中</span>
        <span>🥦 仕上がりを監査中</span>
        <span>📣 バズ構図を最適化中</span>
      </div>
      <div class="img-loading-text">生成中… 30秒ほどお待ちください</div>
    </div>`;
  if (btn) { btn.disabled = true; btn.textContent = '生成中…'; }

  const prompt = buildImagePrompt(r);
  const url = `${POLLINATIONS_BASE}/${encodeURIComponent(prompt)}?width=1024&height=768&model=flux-realism&nologo=true&enhance=true&seed=${r.id}`;

  const img = new Image();
  img.onload = () => {
    /* ユーザーが手動でアップロードした場合（data:で始まる）は上書きしない */
    const manuallySet = (localStorage.getItem(`ohisama_img_${id}`) || '').startsWith('data:');
    if (!manuallySet) applyImage(id, url);
    if (btn) { btn.disabled = false; btn.textContent = '🔄 再生成'; }
  };
  img.onerror = () => {
    area.innerHTML = `
      <span class="detail-hero-emoji">${r.emoji}</span>
      <div class="detail-hero-num">${num}</div>
      <div class="img-error">
        <div class="img-error-text">⚠️ 生成に失敗しました<br>ネットワーク接続を確認してください</div>
      </div>`;
    if (btn) { btn.disabled = false; btn.textContent = '再試行'; }
  };
  img.src = url;
}

/* ── INGREDIENT PARSER ── */
function parseIng(s) {
  const m = s.match(/^(.+?)\s+(\d.*|大さじ.*|小さじ.*|カップ.*|適量.*|少々.*)$/);
  return m ? [m[1].trim(), m[2].trim()] : [s, ''];
}

/* ── HTML BUILDERS ── */
function roleBanner(r) {
  const cards = ROLES.map((ro, i) => `
    <div class="role-banner-card" onclick="toggleRoleComment(${r.id}, ${i})">
      <div class="role-banner-icon">${ro.icon}</div>
      <div class="role-banner-name">${ro.name.replace(/\n/g,'<br>')}</div>
      <div class="role-banner-desc">${ro.desc.replace(/\n/g,'<br>')}</div>
    </div>`).join('');
  return `<div id="rb-${r.id}" class="role-banner">${cards}</div>`;
}

function toggleRoleComment(recipeId, roleIdx) {
  const r       = RECIPES.find(r => r.id === recipeId);
  const cards   = document.querySelectorAll(`#rb-${recipeId} .role-banner-card`);
  const box     = document.getElementById(`rc-${recipeId}`);
  const isActive = cards[roleIdx].classList.contains('active');

  cards.forEach(c => c.classList.remove('active'));

  if (isActive) {
    box.classList.remove('open');
    box.innerHTML = '';
    return;
  }

  cards[roleIdx].classList.add('active');
  const ro = ROLES[roleIdx];
  box.innerHTML = `
    <div class="role-comment-head">
      <span class="role-comment-icon">${ro.icon}</span>
      <span class="role-comment-name">${ro.name.replace(/\n/g,'')}</span>
    </div>
    <div class="role-comment-body">${r.proComments[roleIdx]}</div>`;
  box.classList.add('open');
}

/* ── ROUTER ── */
let _currentTab = 'next';
function nav(target, tab) {
  const app = document.getElementById('app');
  if (target === 'list') {
    if (tab) _currentTab = tab;
    app.innerHTML = listHTML(_currentTab);
    window.scrollTo(0,0);
    document.querySelectorAll('.recipe-card').forEach(el =>
      el.addEventListener('click', () => nav(parseInt(el.dataset.id)))
    );
  } else {
    const r = RECIPES.find(r => r.id === parseInt(target));
    if (r) {
      app.innerHTML = detailHTML(r);
      window.scrollTo(0,0);
    }
  }
}

/* ── HTML EXPORT ── */
async function urlToBase64(url) {
  try {
    const res = await fetch(url);
    const blob = await res.blob();
    return await new Promise((resolve) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = () => resolve(null);
      reader.readAsDataURL(blob);
    });
  } catch { return null; }
}

async function exportHTML() {
  const btn = document.getElementById('btn-export');
  if (btn) { btn.disabled = true; btn.textContent = '書き出し中…'; }

  const images = {};
  for (const r of RECIPES) {
    const stored = localStorage.getItem(`ohisama_img_${r.id}`);
    if (!stored) continue;
    if (stored.startsWith('data:')) {
      images[r.id] = stored;
    } else {
      /* Pollinations URL → base64に変換 */
      const b64 = await urlToBase64(stored);
      if (b64) images[r.id] = b64;
    }
  }

  let html = document.documentElement.outerHTML;
  /* EMBEDDED_IMAGES の空オブジェクトを実データに差し替え */
  html = html.replace('const EMBEDDED_IMAGES = {};', `const EMBEDDED_IMAGES = ${JSON.stringify(images)};`);

  const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  const date = new Date().toISOString().slice(0, 10);
  a.download = `撮影準備シート_${date}.html`;
  a.click();

  if (btn) { btn.disabled = false; btn.textContent = 'HTMLを書き出し'; }
}

/* ── UTILS ── */
function clearPhoto(id) {
  localStorage.removeItem(`ohisama_img_${id}`);
  nav(id);
}

function cpText(text, btn) {
  navigator.clipboard.writeText(text).then(() => {
    const o = btn.textContent; btn.textContent = '✅';
    setTimeout(() => btn.textContent = o, 1800);
  });
}
function cpPrompt(id, btn) {
  const r = RECIPES.find(r => r.id === id);
  navigator.clipboard.writeText(buildMasterPrompt(r)).then(() => {
    const o = btn.innerHTML; btn.textContent = '✅';
    setTimeout(() => btn.innerHTML = o, 1800);
  });
}
function toggleP(id) {
  const el = document.getElementById(`pt-${id}`);
  el.style.display = el.style.display === 'block' ? 'none' : 'block';
}

nav('list');
